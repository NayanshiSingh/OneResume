[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneresume"
version = "0.1.0"
description = "AI-Powered Role-Specific Resume Generation Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "google-genai>=2.31.0,<2.32",
    "pinecone>=5.0.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "Jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2",
    "weasyprint>=63",
    "pypdf>=6.20.1,<6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
